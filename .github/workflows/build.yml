name: Build and publish image

# Run by hand from the Actions tab (or `gh workflow run build.yml`). One run builds the
# pinned tdlib/telegram-bot-api commit for every platform and publishes one multi-arch
# tag to ghcr.io with a build provenance attestation.

on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: tdlib/telegram-bot-api commit to build (full SHA)
        required: true
        default: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
      revision:
        description: Image revision for this server version (the N in <version>-appletalk.N)
        required: true
        default: '1'

permissions:
  contents: read

# One publish at a time, so two runs can't both pass the overwrite check.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  ALPINE_VERSION: '3.24'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/386, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { platform: linux/arm/v7, runner: ubuntu-24.04 }
          - { platform: linux/arm/v6, runner: ubuntu-24.04 }
          - { platform: linux/ppc64le, runner: ubuntu-24.04 }
    steps:
      - name: Check the server ref
        env:
          SERVER_REF: ${{ inputs.server_ref }}
        run: |
          [[ "$SERVER_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "server_ref must be a full commit SHA" >&2; exit 1; }

      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tdlib/telegram-bot-api
          ref: ${{ inputs.server_ref }}
          path: telegram-bot-api
          submodules: recursive
          persist-credentials: false

      - name: Set build variables
        id: vars
        env:
          PLATFORM: ${{ matrix.platform }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/telegram-bot-api" >> "$GITHUB_OUTPUT"
          # Emulated builds are slow and memory-hungry: keep them to two jobs.
          case "$PLATFORM" in
            linux/amd64|linux/386|linux/arm64) echo "nproc=$(nproc)" >> "$GITHUB_OUTPUT" ;;
            *) echo "nproc=2" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64' && matrix.platform != 'linux/386' && matrix.platform != 'linux/arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            nproc=${{ steps.vars.outputs.nproc }}
          provenance: false
          outputs: type=image,name=${{ steps.vars.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.vars.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the multi-arch tag
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the server source (for its version)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tdlib/telegram-bot-api
          ref: ${{ inputs.server_ref }}
          path: telegram-bot-api
          persist-credentials: false

      - name: Work out the tag
        id: tag
        env:
          REVISION: ${{ inputs.revision }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$REVISION" =~ ^[1-9][0-9]*$ ]] || { echo "revision must be a number from 1 up" >&2; exit 1; }
          echo "image=ghcr.io/${OWNER,,}/telegram-bot-api" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C telegram-bot-api rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^project(TelegramBotApi VERSION \([0-9.]*\).*/\1/p' telegram-bot-api/CMakeLists.txt)
          [ -n "$version" ] || { echo "no version in CMakeLists.txt" >&2; exit 1; }
          echo "tag=${version}-appletalk.${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        env:
          IMAGE: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
        run: |
          if out=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "$IMAGE already exists; bump the revision" >&2
            exit 1
          fi
          # Go on only when the registry says the tag doesn't exist; any other error stops here.
          if ! grep -qiE 'not found|manifest unknown' <<<"$out"; then
            echo "could not check $IMAGE:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Create the multi-arch tag
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
          SERVER_REF: ${{ steps.tag.outputs.commit }}
        run: |
          refs=()
          for d in *; do refs+=("${IMAGE}@sha256:${d}"); done
          [ "${#refs[@]}" -eq 6 ] || { echo "expected 6 platform digests, got ${#refs[@]}" >&2; exit 1; }
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.version=${TAG}" \
            --annotation "index:org.opencontainers.image.base.name=docker.io/library/alpine:${{ env.ALPINE_VERSION }}" \
            --annotation "index:io.github.tdlib.telegram-bot-api.commit=${SERVER_REF}" \
            -t "${IMAGE}:${TAG}" \
            "${refs[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${TAG}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
